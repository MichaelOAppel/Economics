<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samfundsøkonomi - Interaktivt Overblik</title>
    <!-- Henter Tailwind CSS til moderne, responsiv styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Lys, ren baggrund */
            color: #0f172a;
            overflow-x: hidden;
        }

        .map-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            background-color: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.5s ease;
            border: 1px solid #f1f5f9;
        }

        /* Verdenskortet gøres mørkegråt med 55% opacity */
        .world-map-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.55; 
            transition: opacity 0.5s ease, filter 0.5s ease;
            pointer-events: none;
            user-select: none;
        }

        .map-container.dimmed .world-map-image {
            opacity: 0.2;
            filter: blur(1px); 
        }

        .node {
            position: absolute;
            width: 14px;
            height: 14px;
            /* Neongul med en mørkgylden kant for synlighed på hvid baggrund */
            background-color: #eaff00; 
            border: 1px solid #ca8a04;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 0 4px rgba(234, 255, 0, 0.3);
            z-index: 10;
        }

        .node:hover {
            transform: translate(-50%, -50%) scale(1.6);
            background-color: #facc15; 
            box-shadow: 0 0 0 6px rgba(250, 204, 21, 0.4);
            z-index: 50;
        }

        /* Ad-hoc punkter er røde */
        .node.adhoc {
            background-color: #ef4444; 
            border: 1px solid #b91c1c;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
        }

        .node.adhoc:hover {
            background-color: #dc2626; 
            box-shadow: 0 0 0 6px rgba(220, 38, 38, 0.3);
        }

        .node-label {
            position: absolute;
            top: 150%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, top 0.3s ease, box-shadow 0.3s ease;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1e293b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            z-index: 40;
        }

        .node-label::after {
            content: '';
            position: absolute;
            bottom: 100%;
            border-width: 6px;
            border-style: solid;
            border-color: transparent transparent #ffffff transparent;
        }

        /* Dynamisk placering afrundet til skærmen */
        .label-center {
            left: 50%;
            transform: translateX(-50%);
        }
        .label-center::after { left: 50%; margin-left: -6px; }

        .label-left {
            left: 0;
            transform: translateX(0);
        }
        .label-left::after { left: 10px; }

        .label-right {
            right: 0;
            transform: translateX(0);
        }
        .label-right::after { right: 10px; }

        .node:hover .node-label {
            opacity: 1;
            top: 200%;
        }

        @media (max-width: 768px) {
            .map-container {
                aspect-ratio: 4 / 3;
            }
            .node { width: 18px; height: 18px; }
            .node-label { display: none; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 md:px-8">

    <header class="w-full max-w-6xl mb-12 text-center">
        <h1 class="text-5xl md:text-7xl font-extrabold text-slate-900 mb-6 tracking-tight">
            Samfundsøkonomi
        </h1>
        <p class="text-slate-600 text-lg md:text-xl max-w-2xl mx-auto font-light leading-relaxed">
            Udforsk de 30 temaer i den globale og danske økonomi. Før musen over punkterne på verdenskortet for at dykke ned i de enkelte temaer.
        </p>
    </header>

    <main class="w-full max-w-6xl flex-grow relative flex flex-col items-center">
        
        <div id="map" class="map-container">
            <img src="billeder/MitVerdenskor.png" alt="Verdenskort" class="world-map-image" id="mapImage" onerror="this.src='https://placehold.co/1200x675/f8fafc/64748b?text=Verdenskort+Pladsholder';">
        </div>

        <div class="mt-16 w-full md:hidden">
            <h2 class="text-2xl font-bold mb-6 text-slate-800 border-b pb-2 border-slate-200">Alle Temaer</h2>
            <ul id="mobile-list" class="space-y-3">
            </ul>
        </div>
    </main>

    <script>
        const chapters = [
            // X-koordinater stiger systematisk med ca. 3% per tema fra 3 til 90.
            { id: 1, title: "Tema 1: Den globale økonomi", x: 3, y: 30 },
            { id: 2, title: "Tema 2: Danmarks økonomi", x: 6, y: 60 },
            { id: 3, title: "Tema 3: Produktion og indkomst", x: 9, y: 20 },
            { id: 4, title: "Tema 4: Prisdannelsen", x: 12, y: 70 },
            { id: 5, title: "Tema 5: Husholdninger og forbrug", x: 15, y: 40 },
            { id: 6, title: "Tema 6: Arbejdsmarkedet", x: 18, y: 80 },
            { id: 7, title: "Tema 7: Offentlig sektor og velfærd", x: 21, y: 25 },
            { id: 8, title: "Tema 8: Finanspolitik", x: 24, y: 55 },
            { id: 9, title: "Tema 9: Betalingsbalance og kapitalbalance", x: 27, y: 35 },
            { id: 10, title: "Tema 10: Valuta", x: 30, y: 65 },
            { id: 11, title: "Tema 11: Den finansielle sektor", x: 33, y: 20 },
            { id: 12, title: "Tema 12: Pengepolitik", x: 36, y: 75 },
            { id: 13, title: "Tema 13: Konkurrenceevneforbedrende politik", x: 39, y: 45 },
            { id: 14, title: "Tema 14: Strukturpolitik", x: 42, y: 30 },
            { id: 15, title: "Tema 15: Miljøpolitik", x: 45, y: 60 },
            { id: 16, title: "Tema 16: Inflation", x: 48, y: 25 },
            { id: 17, title: "Tema 17: Makroøkonomisk landeanalyse", x: 51, y: 80 },
            { id: 18, title: "Tema 18: Danmarks handel", x: 54, y: 40 },
            { id: 19, title: "Tema 19: Konkurrenceevne", x: 57, y: 70 },
            { id: 20, title: "Tema 20: Verdenshandelens udvikling og fordeling", x: 60, y: 20 },
            { id: 21, title: "Tema 21: Globaliseringen af verdensøkonomien", x: 63, y: 55 },
            { id: 22, title: "Tema 22: Teorier om handel", x: 66, y: 35 },
            { id: 23, title: "Tema 23: Frihandel kontra protektionisme", x: 69, y: 85 },
            { id: 24, title: "Tema 24: Internationale organisationer", x: 72, y: 50 },
            { id: 25, title: "Tema 25: Den Europæiske Union", x: 75, y: 25 },
            { id: 26, title: "Tema 26: Udviklingsøkonomisk landeanalyse", x: 78, y: 65 },
            { id: 27, title: "Tema 27: Økonomisk metode", x: 81, y: 40 },
            { id: 28, title: "Tema 28: Grønlands økonomi", x: 84, y: 80 },
            { id: 29, title: "Tema 29: Public Choice", x: 87, y: 55 },
            { id: 30, title: "Tema 30: Endogene institutioner", x: 90, y: 30 },
            
            // De to resterende ad-hoc punkter ligger helt til højre
            { id: 31, title: "Ad-hoc emne 4", x: 93, y: 15, isAdhoc: true },
            { id: 32, title: "Ad-hoc emne 5", x: 96, y: 80, isAdhoc: true }
        ];

        const mapContainer = document.getElementById('map');
        const mobileList = document.getElementById('mobile-list');

        function initMap() {
            chapters.forEach(chapter => {
                
                // Peger stensikkert på html-filerne
                const filename = 'KapSider/kapitel' + chapter.id + '.html';

                const node = document.createElement('div');
                node.className = 'node';
                
                if (chapter.isAdhoc) {
                    node.classList.add('adhoc');
                }
                
                node.style.left = `${chapter.x}%`;
                node.style.top = `${chapter.y}%`;

                const label = document.createElement('div');
                label.className = 'node-label';
                label.innerText = chapter.title;
                
                // Intelligent styring af label-placering
                if (chapter.x < 15) {
                    label.classList.add('label-left');
                } else if (chapter.x > 85) {
                    label.classList.add('label-right');
                } else {
                    label.classList.add('label-center');
                }
                
                node.appendChild(label);

                node.addEventListener('mouseenter', () => {
                    mapContainer.classList.add('dimmed');
                });

                node.addEventListener('mouseleave', () => {
                    mapContainer.classList.remove('dimmed');
                });

                node.addEventListener('click', () => {
                    window.location.href = filename;
                });

                mapContainer.appendChild(node);

                const listItem = document.createElement('li');
                listItem.className = 'bg-white border border-slate-200 shadow-sm p-4 rounded-xl text-sm md:text-base font-semibold hover:bg-slate-50 cursor-pointer flex justify-between items-center transition-colors';
                
                const textColorClass = chapter.isAdhoc ? 'text-red-600' : 'text-slate-700';
                const arrowColorClass = chapter.isAdhoc ? 'text-red-500' : 'text-yellow-500';
                
                listItem.innerHTML = `<span class="${textColorClass}">${chapter.title}</span> <svg class="w-5 h-5 ${arrowColorClass}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
                
                listItem.addEventListener('click', () => {
                     window.location.href = filename;
                });
                
                mobileList.appendChild(listItem);
            });
        }

        window.onload = initMap;
    </script>
</body>
</html>
