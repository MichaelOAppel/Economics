<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samfundsøkonomi - Interaktivt Overblik</title>
    <!-- Henter Tailwind CSS til moderne, responsiv styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Lys, ren baggrund */
            color: #0f172a;
            overflow-x: hidden;
        }

        .map-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            background-color: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.5s ease;
            border: 1px solid #f1f5f9;
        }

        /* Verdenskortet gøres mørkegråt med 55% opacity */
        .world-map-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.55; 
            transition: opacity 0.5s ease, filter 0.5s ease;
            pointer-events: none;
            user-select: none;
        }

        .map-container.dimmed .world-map-image {
            opacity: 0.2;
            filter: blur(1px); 
        }

        .node {
            position: absolute;
            width: 14px;
            height: 14px;
            /* Neongul med en mørkgylden kant for synlighed på hvid baggrund */
            background-color: #eaff00; 
            border: 1px solid #ca8a04;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 0 4px rgba(234, 255, 0, 0.3);
            z-index: 10;
        }

        .node:hover {
            transform: translate(-50%, -50%) scale(1.6);
            background-color: #facc15; 
            box-shadow: 0 0 0 6px rgba(250, 204, 21, 0.4);
            z-index: 50;
        }

        /* Ad-hoc punkter er røde */
        .node.adhoc {
            background-color: #ef4444; 
            border: 1px solid #b91c1c;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
        }

        .node.adhoc:hover {
            background-color: #dc2626; 
            box-shadow: 0 0 0 6px rgba(220, 38, 38, 0.3);
        }

        .node-label {
            position: absolute;
            top: 150%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, top 0.3s ease, box-shadow 0.3s ease;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1e293b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            z-index: 40;
        }

        .node-label::after {
            content: '';
            position: absolute;
            bottom: 100%;
            border-width: 6px;
            border-style: solid;
            border-color: transparent transparent #ffffff transparent;
        }

        /* Dynamisk placering afrundet til skærmen */
        .label-center {
            left: 50%;
            transform: translateX(-50%);
        }
        .label-center::after { left: 50%; margin-left: -6px; }

        .label-left {
            left: 0;
            transform: translateX(0);
        }
        .label-left::after { left: 10px; }

        .label-right {
            right: 0;
            transform: translateX(0);
        }
        .label-right::after { right: 10px; }

        .node:hover .node-label {
            opacity: 1;
            top: 200%;
        }

        @media (max-width: 768px) {
            .map-container {
                aspect-ratio: 4 / 3;
            }
            .node { width: 18px; height: 18px; }
            .node-label { display: none; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 md:px-8">

    <header class="w-full max-w-6xl mb-12 text-center">
        <h1 class="text-5xl md:text-7xl font-extrabold text-slate-900 mb-6 tracking-tight">
            Samfundsøkonomi
        </h1>
        <p class="text-slate-600 text-lg md:text-xl max-w-2xl mx-auto font-light leading-relaxed">
            Udforsk de 30 temaer i den globale og danske økonomi. Før musen over punkterne på verdenskortet for at dykke ned i de enkelte temaer.
        </p>
    </header>

    <main class="w-full max-w-6xl flex-grow relative flex flex-col items-center">
        
        <div id="map" class="map-container">
            <img src="billeder/MitVerdenskor.png" alt="Verdenskort" class="world-map-image" id="mapImage" onerror="this.src='https://placehold.co/1200x675/f8fafc/64748b?text=Verdenskort+Pladsholder';">
        </div>

        <div class="mt-16 w-full max-w-2xl mx-auto bg-white border border-slate-200 rounded-2xl shadow-sm p-8 md:p-10">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6 text-center md:text-left">
                Alle Temaer
            </h2>
            <ul id="theme-list" class="space-y-4">
            </ul>
        </div>
    </main>

    <!-- chapters-arrayet (temaer, koordinater og underafsnit) hentes nu fra js/temaer.js,
         som også bruges af kapitel-sidernes venstremenu -->
    <script src="js/temaer.js"></script>
    <script>
        const mapContainer = document.getElementById('map');
        const themeList = document.getElementById('theme-list');

        function initMap() {
            chapters.forEach(chapter => {
                
                // Peger stensikkert på html-filerne
                const filename = 'KapSider/kapitel' + chapter.id + '.html';

                const node = document.createElement('div');
                node.className = 'node';
                
                if (chapter.isAdhoc) {
                    node.classList.add('adhoc');
                }
                
                node.style.left = `${chapter.x}%`;
                node.style.top = `${chapter.y}%`;

                const label = document.createElement('div');
                label.className = 'node-label';
                label.innerText = chapter.title;
                
                // Intelligent styring af label-placering
                if (chapter.x < 15) {
                    label.classList.add('label-left');
                } else if (chapter.x > 85) {
                    label.classList.add('label-right');
                } else {
                    label.classList.add('label-center');
                }
                
                node.appendChild(label);

                node.addEventListener('mouseenter', () => {
                    mapContainer.classList.add('dimmed');
                });

                node.addEventListener('mouseleave', () => {
                    mapContainer.classList.remove('dimmed');
                });

                node.addEventListener('click', () => {
                    window.location.href = filename;
                });

                mapContainer.appendChild(node);

                const listItem = document.createElement('li');
                listItem.className = 'menu-item';

                const textColorClass = chapter.isAdhoc ? 'text-red-600' : 'text-slate-700';

                listItem.innerHTML = `<a href="${filename}" class="block font-semibold ${textColorClass} hover:text-blue-900 transition-colors">${chapter.title}</a>`;

                themeList.appendChild(listItem);
            });
        }

        window.onload = initMap;
    </script>
</body>
</html>
