<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samfundsøkonomi - Interaktivt Overblik</title>
    <!-- Henter Tailwind CSS til moderne, responsiv styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Lys, imødekommende baggrund */
            background-color: #f8fafc; 
            color: #0f172a;
            overflow-x: hidden;
        }

        .map-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            /* Ren hvid baggrund til selve kortet */
            background-color: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.5s ease;
            border: 1px solid #f1f5f9;
        }

        .world-map-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* HER ER ÆNDRINGEN: Opacity 0.55 gør det sorte kort flot mørkegråt mod den hvide baggrund */
            opacity: 0.55; 
            transition: opacity 0.5s ease, filter 0.5s ease;
            pointer-events: none;
            user-select: none;
        }

        /* Effekt når man hovrer over et punkt - toner kortet endnu mere ned */
        .map-container.dimmed .world-map-image {
            opacity: 0.2;
            filter: blur(1px); 
        }

        .node {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #4f46e5; 
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
            z-index: 10;
        }

        .node:hover {
            transform: translate(-50%, -50%) scale(1.6);
            background-color: #0d9488; 
            box-shadow: 0 0 0 6px rgba(13, 148, 136, 0.3);
            z-index: 50;
        }

        .node-label {
            position: absolute;
            top: 150%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, top 0.3s ease, box-shadow 0.3s ease;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1e293b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            z-index: 40;
        }

        .node-label::after {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: transparent transparent #ffffff transparent;
        }

        .node:hover .node-label {
            opacity: 1;
            top: 200%;
        }

        .node.adhoc {
            background-color: #f97316; 
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.2);
        }

        .node.adhoc:hover {
            background-color: #ea580c; 
            box-shadow: 0 0 0 6px rgba(234, 88, 12, 0.3);
        }

        @media (max-width: 768px) {
            .map-container {
                aspect-ratio: 4 / 3;
            }
            .node {
                width: 18px; 
                height: 18px;
            }
            .node-label {
                display: none; 
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 md:px-8">

    <header class="w-full max-w-6xl mb-12 text-center">
        <h1 class="text-5xl md:text-7xl font-extrabold text-slate-900 mb-6 tracking-tight">
            Samfundsøkonomi
        </h1>
        <p class="text-slate-600 text-lg md:text-xl max-w-2xl mx-auto font-light leading-relaxed">
            Udforsk de 27 temaer i den globale og danske økonomi. Før musen over punkterne på verdenskortet for at dykke ned i de enkelte temaer.
        </p>
    </header>

    <main class="w-full max-w-6xl flex-grow relative flex flex-col items-center">
        
        <div id="map" class="map-container">
            <!-- Peger nu korrekt på dit billede på GitHub -->
            <img src="billeder/MitVerdenskor.png" alt="Verdenskort" class="world-map-image" id="mapImage">
        </div>

        <div class="mt-16 w-full md:hidden">
            <h2 class="text-2xl font-bold mb-6 text-slate-800 border-b pb-2 border-slate-200">Alle Temaer</h2>
            <ul id="mobile-list" class="space-y-3">
            </ul>
        </div>
    </main>

    <script>
        // Data for kapitler med "Tema" i titlerne
        const chapters = [
            { id: 1, title: "Tema 1: Den globale økonomi", x: 4, y: 30 },
            { id: 2, title: "Tema 2: Danmarks økonomi", x: 7, y: 60 },
            { id: 3, title: "Tema 3: Produktion og indkomst", x: 11, y: 20 },
            { id: 4, title: "Tema 4: Prisdannelsen", x: 14, y: 70 },
            { id: 5, title: "Tema 5: Husholdninger og forbrug", x: 18, y: 40 },
            { id: 6, title: "Tema 6: Arbejdsmarkedet", x: 21, y: 80 },
            { id: 7, title: "Tema 7: Offentlig sektor og velfærd", x: 25, y: 25 },
            { id: 8, title: "Tema 8: Finanspolitik", x: 28, y: 55 },
            { id: 9, title: "Tema 9: Betalingsbalance og kapitalbalance", x: 32, y: 35 },
            { id: 10, title: "Tema 10: Valuta", x: 35, y: 65 },
            { id: 11, title: "Tema 11: Den finansielle sektor", x: 39, y: 20 },
            { id: 12, title: "Tema 12: Pengepolitik", x: 42, y: 75 },
            { id: 13, title: "Tema 13: Konkurrenceevneforbedrende politik", x: 46, y: 45 },
            { id: 14, title: "Tema 14: Strukturpolitik", x: 50, y: 30 },
            { id: 15, title: "Tema 15: Miljøpolitik", x: 53, y: 60 },
            { id: 16, title: "Tema 16: Inflation", x: 57, y: 25 },
            { id: 17, title: "Tema 17: Makroøkonomisk landeanalyse", x: 60, y: 80 },
            { id: 18, title: "Tema 18: Danmarks handel", x: 64, y: 40 },
            { id: 19, title: "Tema 19: Konkurrenceevne", x: 67, y: 70 },
            { id: 20, title: "Tema 20: Verdenshandelens udvikling og fordeling", x: 71, y: 20 },
            { id: 21, title: "Tema 21: Globaliseringen af verdensøkonomien", x: 74, y: 55 },
            { id: 22, title: "Tema 22: Teorier om handel", x: 78, y: 35 },
            { id: 23, title: "Tema 23: Frihandel kontra protektionisme", x: 81, y: 85 },
            { id: 24, title: "Tema 24: Internationale organisationer", x: 85, y: 50 },
            { id: 25, title: "Tema 25: Den Europæiske Union", x: 88, y: 25 },
            { id: 26, title: "Tema 26: Udviklingsøkonomisk landeanalyse", x: 92, y: 65 },
            { id: 27, title: "Tema 27: Økonomisk metode", x: 96, y: 40 },
            
            { id: 28, title: "Ad-hoc emne 1", x: 15, y: 45, isAdhoc: true },
            { id: 29, title: "Ad-hoc emne 2", x: 38, y: 85, isAdhoc: true },
            { id: 30, title: "Ad-hoc emne 3", x: 62, y: 55, isAdhoc: true },
            { id: 31, title: "Ad-hoc emne 4", x: 80, y: 15, isAdhoc: true },
            { id: 32, title: "Ad-hoc emne 5", x: 90, y: 80, isAdhoc: true }
        ];

        const mapContainer = document.getElementById('map');
        const mobileList = document.getElementById('mobile-list');

        function initMap() {
            chapters.forEach(chapter => {
                
                // Peger stadig på filnavnene "kapitelX.html" i mappen "KapSider"
                const filename = 'KapSider/kapitel' + chapter.id + '.html';

                const node = document.createElement('div');
                node.className = 'node';
                
                if (chapter.isAdhoc) {
                    node.classList.add('adhoc');
                }
                
                node.style.left = `${chapter.x}%`;
                node.style.top = `${chapter.y}%`;

                const label = document.createElement('div');
                label.className = 'node-label';
                label.innerText = chapter.title;
                
                if (chapter.x < 15) {
                    label.style.left = '50%';
                    label.style.transform = 'translateX(0)';
                } else if (chapter.x > 85) {
                    label.style.right = '50%';
                    label.style.transform = 'translateX(0)';
                } else {
                    label.style.left = '50%';
                    label.style.transform = 'translateX(-50%)';
                }
                
                node.appendChild(label);

                node.addEventListener('mouseenter', () => {
                    mapContainer.classList.add('dimmed');
                });

                node.addEventListener('mouseleave', () => {
                    mapContainer.classList.remove('dimmed');
                });

                node.addEventListener('click', () => {
                    window.location.href = filename;
                });

                mapContainer.appendChild(node);

                const listItem = document.createElement('li');
                listItem.className = 'bg-white border border-slate-200 shadow-sm p-4 rounded-xl text-sm md:text-base font-semibold hover:bg-slate-50 cursor-pointer flex justify-between items-center transition-colors';
                
                const textColorClass = chapter.isAdhoc ? 'text-orange-600' : 'text-slate-700';
                
                listItem.innerHTML = `<span class="${textColorClass}">${chapter.title}</span> <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
                
                listItem.addEventListener('click', () => {
                     window.location.href = filename;
                });
                
                mobileList.appendChild(listItem);
            });
        }

        window.onload = initMap;
    </script>
</body>
</html>
